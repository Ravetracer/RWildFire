[workspace]
resolver = "3"
members = ["crates/jwf-core", "crates/jwf-gpu", "crates/jwf-app", "crates/jwf-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
