[workspace]
resolver = "3"
members = ["crates/rwf-core", "crates/rwf-gpu", "crates/rwf-script", "crates/rwf-app", "crates/rwf-cli"]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "LGPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
# File and line numbers only: keeps target/ small (full debug info grew it to tens of GB).
debug = "line-tables-only"

# The core is ported from Java, whose int arithmetic wraps (noise hashes, cell indices of
# far-away points): no overflow traps in debug builds either, as in release builds.
[profile.dev.package.rwf-core]
overflow-checks = false

[profile.dev.package."*"]
opt-level = 3
debug = false
