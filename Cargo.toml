[workspace]
resolver = "3"
members = ["crates/rwf-core", "crates/rwf-gpu", "crates/rwf-script", "crates/rwf-app", "crates/rwf-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
# File and line numbers only: keeps target/ small (full debug info grew it to tens of GB).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
