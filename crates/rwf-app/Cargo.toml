[package]
name = "rwf-app"
version = "1.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.36.2"
egui-phosphor = "0.14.0"
egui-wgpu = "0.36.2"
rwf-core = { version = "1.1.0", path = "../rwf-core" }
rwf-gpu = { version = "1.1.0", path = "../rwf-gpu" }
rwf-script = { version = "1.1.0", path = "../rwf-script" }
png = "0.18.1"
rfd = "0.17.2"
wgpu = "30"
cpal = "0.15"

[features]
# The GPL-licensed `taprats` variation (see rwf-core).
taprats = ["rwf-core/taprats"]
